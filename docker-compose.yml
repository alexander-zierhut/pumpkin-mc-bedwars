# BedWars on Pumpkin, built from this checkout. Usually started through ./bedwars.sh.
# The server directory (worlds, pumpkin.toml, plugin data) is ./data.
services:
  bedwars:
    build: .
    image: pumpkin-mc-bedwars:local
    container_name: pumpkin-mc-bedwars
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${BEDWARS_PORT:-25565}:25565"
      - "127.0.0.1:${BEDWARS_RCON_PORT:-25575}:25575"
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./data:/srv
    mem_limit: 1g
